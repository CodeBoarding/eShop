name: Keep the demo review
run-name: Curated item reservation demo findings (PR 11)

# Branch-only demo publisher. No new automated analysis is performed.
on:
  workflow_dispatch:
    inputs:
      pr: { description: 'Pull request (this curated demo supports 11 only)', default: '11' }

permissions:
  actions: read
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the pinned original review and its base graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          [ "$PR" = 11 ]
          mkdir review base
          gh api "repos/$REPO/actions/artifacts/15041612761/zip" > review.zip
          unzip -oq review.zip -d review
          gh api "repos/$REPO/actions/artifacts/15040577634/zip" > base.zip
          unzip -oq base.zip -d base
          cp base/analysis.json review/base_analysis.json
      - name: Add clearly labelled curated findings
        run: python3 .demo/curated-review/prepare.py review
      - uses: actions/upload-artifact@v4
        with:
          name: codeboarding-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: review/
          if-no-files-found: error
          retention-days: 90
